        <section>        
            <div class="edit-box">
                <h2>Thông tin phiếu nhập</h2>
                <form>
  <div class="row-input">
    <div class="form-group">
      <label for="ngaynhap">Ngày nhập:</label>
      <input type="date" id="ngaynhap" name="ngaynhap">
    </div>

    <div class="form-group">
      <label for="maphieunhap">Mã phiếu nhập:</label>
      <input type="text" id="maphieunhap" name="maphieunhap" value="PN006">
    </div>
  </div>

  <!-- Bọc các dòng sản phẩm trong container này -->
  <label>Chọn sản phẩm nhập:</label>
<button type="button" id="add-product-btn">+ Thêm sản phẩm</button>

<div id="product-container">
  <!-- Dòng sản phẩm đầu tiên -->
</div>

<label for="tong">Tổng số lượng:</label>
<input type="text" id="tong" readonly>

<label for="tongtien">Tổng số tiền (VNĐ):</label>
<input type="text" id="tongtien" readonly>


  <button type="button"
    onclick="if (confirm('Bạn có chắc muốn lưu phiếu nhập không?')) {alert('Đã lưu thành công!');} else { alert('Hủy lưu!'); }">
    Lưu phiếu nhập
  </button>
</form>

        </section>
        <script>
let index = 0;

function addProductRow() {
  index++;

  const container = document.getElementById("product-container");

  const box = document.createElement("div");
  box.className = "product-box";
  box.setAttribute("data-id", index);

  box.innerHTML = `
      <label>Sản phẩm ${index}:</label>
      <select class="product-select">
        <option value="" selected>--Chọn sản phẩm--</option>
        <option data-price="35000">Hồng trà đào</option>
        <option data-price="35000">Trà vải lài</option>
        <option data-price="35000">Trà ô long dâu</option>
        <option data-price="35000">Trà sữa ô long</option>
        <option data-price="35000">Trà sữa truyền thống</option>
        <option data-price="35000">Trà lựu đỏ</option>
        <option data-price="35000">Trà kem cheese</option>
        <option data-price="35000">Cà phê kem cheese</option>
        <option data-price="35000">Cà phê muối</option>
        <option data-price="35000">Cà phê sữa</option>
      </select>

      <label>Số lượng:</label>
      <input type="number" class="product-qty" value="0">

      <label>Giá nhập (VNĐ):</label>
      <input type="number" class="gianhap" value="35000">

      <!-- ✅ Nút X nằm dưới -->
      <button class="delete-btn" onclick="deleteProduct(${index})">x</button>
  `;


  container.appendChild(box);

  box.querySelectorAll(".product-qty, .gianhap").forEach(item => {
    item.addEventListener("input", calcTotal);
  });
}

function deleteProduct(id) {
  const item = document.querySelector(`.product-box[data-id="${id}"]`);
  if (item) item.remove();
  calcTotal();
}

function calcTotal() {
  const boxes = document.querySelectorAll(".product-box");
  let totalQty = 0;
  let totalMoney = 0;

  boxes.forEach(box => {
    const qty = parseInt(box.querySelector(".product-qty").value) || 0;
    const price = parseInt(box.querySelector(".gianhap").value) || 0;
    totalQty += qty;
    totalMoney += qty * price;
  });

  document.getElementById("tong").value = totalQty;
  document.getElementById("tongtien").value = totalMoney.toLocaleString("vi-VN");
}

// Gán nút thêm
document.getElementById("add-product-btn").addEventListener("click", addProductRow);

// Thêm dòng đầu tiên khi mở trang
addProductRow();
</script>
