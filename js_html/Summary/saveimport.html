<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nhập kho - Quản trị</title>
    <link rel="stylesheet" href="../../css/style.css" />
  </head>
  <body>
    <!-- Thanh topbar -->
    <section>
      <div class="topbar">
        <a href="../Products/home.html">Trang chủ</a>
        <a href="../Customers/customers.html">Khách hàng</a>
        <a href="../Products/products.html">Sản phẩm</a>
        <a href="../Manage/Mangage.html">Đơn hàng</a>
        <a href="../Summary/arrangehightolow.html" class="active">Nhập kho</a>
      </div>

      <div class="admin-box">
        <img class="adminlogo" src="../../images/adminicon.png" alt="adminlogo" />
        <a href="../Products/home.html" class="logo"><img src="../../images/logo2.png" alt="logo" /></a>
        <h3>Admin/</h3>
        <a href="../../admin.html"><span class="logout-text">Đăng xuất</span></a>
      </div>

    <section class="import-page">
  <div class="import-container">
  <h2>Phiếu Nhập Kho</h2>

  <div class="import-form-group">
    <label>Mã phiếu nhập:</label>
    <input type="text" placeholder="PN001">
  </div>

  <div class="import-form-group">
    <label>Ngày nhập:</label>
    <input type="date">
  </div>

  <div class="import-form-group">
    <label>Nhà cung cấp:</label>
    <input type="text" placeholder="VD: Công ty Cà phê Trung Nguyên">
  </div>

  <div class="import-form-group">
    <label>Nhân viên nhập:</label>
    <input type="text" placeholder="VD: Nguyễn Văn A">
  </div>

  <table class="import-table">
    <thead>
      <tr>
        <th>Mã SP</th>
        <th>Tên sản phẩm</th>
        <th>Số lượng nhập</th>
        <th>Đơn giá nhập (VNĐ)</th>
        <th>Thành tiền</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>SP001</td>
        <td>Trà đào</td>
        <td>4</td>
        <td>49.000</td>
        <td>196.000</td>
      </tr>
      <tr>
        <td>SP002</td>
        <td>Trà sữa ô long</td>
        <td>2</td>
        <td>49.000</td>
        <td>98.000</td>
      </tr>
      <tr>
        <td>SP003</td>
        <td>Cà phê sữa</td>
        <td>7</td>
        <td>49.000</td>
        <td>343.000</td>
      </tr>
    </tbody>
  </table>

  <div class="add-row">
    <button onclick="window.location.href='addimport.html'">+ Thêm đơn nhập</button>
  </div>

  <div class="import-total">
    Tổng cộng: <span>637.000</span> VNĐ
  </div>

    <div class="import-actions">
       <button>Lưu phiếu</button>
    </div>
  </div>
</section>
  </body>
</html>
